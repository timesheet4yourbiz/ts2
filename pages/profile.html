<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>My Profile | WORKTIMESYS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        
        body { background-color: #f4f7fb; -webkit-font-smoothing: antialiased; min-width: 1280px !important; overflow-x: auto !important; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; }
        
        /* Topbar Styles Maintained from original */
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04) !important; }
        .brand { min-width: 195px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #071a3b; }
        .brand-mark { width: 34px; height: 38px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
        .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 19px; height: 19px; transform: rotate(30deg) skew(-4deg); border-radius: 4px; }
        .brand-mark::before { background: linear-gradient(135deg, #0d6efd 0 52%, #f59e0b 52% 100%); top: 3px; left: 3px; }
        .brand-mark::after { background: linear-gradient(135deg, #0b2d60 0 52%, #ef4444 52% 100%); bottom: 3px; right: 1px; }
        .brand-copy strong { display: block; font-size: 19px; line-height: 18px; letter-spacing: -.8px; font-weight: 800; }
        .brand-copy strong span { color: #0d6efd; }
        .brand-copy small { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; letter-spacing: .35px; color: #34527d; }
        
        .nav { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        
        .profile { height: 40px; display: flex; align-items: center; gap: 9px; padding-left: 3px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; background: #1677ff; font-weight: 700; font-size: 15px; }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e5e7eb;
            overflow: hidden;
            display: flex;
            min-height: 600px;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px 10px 42px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.875rem;
            color: #1f2937;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .input-field:read-only {
            background-color: #f9fafb;
            color: #4b5563;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            width: 18px;
            height: 18px;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body class="text-slate-800">

    <!-- TOP MENU (Diuruskan oleh sidebar.js) -->
    <header class="topbar" id="topbarContainer"></header>

    <main class="p-8 max-w-[1100px] mx-auto">

        <!-- HEADER -->
        <div class="flex items-center gap-4 mb-6">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900 m-0 tracking-tight">My Profile</h1>
                <p class="text-sm text-slate-500 m-0 mt-0.5">Manage your account settings and security</p>
            </div>
        </div>

        <!-- MAIN CARD CONTAINER -->
        <div class="main-card flex-col md:flex-row">
            
            <!-- LEFT SIDEBAR (Profile Summary) -->
            <div class="w-full md:w-[320px] p-8 border-r border-slate-100 flex flex-col items-center">
                
                <!-- Avatar -->
                <div class="relative mb-4">
                    <div id="avatarInitials" class="w-32 h-32 rounded-full bg-blue-600 text-white flex items-center justify-center text-5xl font-bold shadow-md">
                        M
                    </div>
                    <button class="absolute bottom-1 right-1 bg-white p-2.5 rounded-full shadow-md border border-slate-100 text-slate-600 hover:text-blue-600 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                </div>

                <h2 id="leftNameTitle" class="text-[19px] font-extrabold text-slate-900 uppercase tracking-tight text-center">LOADING...</h2>
                <div id="leftRoleBadge" class="mt-2.5 px-4 py-1 bg-amber-50 text-amber-600 border border-amber-100 rounded-full text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
                    Loading...
                </div>

                <div class="w-full h-px bg-slate-100 my-8"></div>

                <!-- Info List -->
                <div class="w-full space-y-5">
                    <div class="flex gap-4 items-start">
                        <svg class="w-5 h-5 text-slate-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 mb-0.5 uppercase tracking-wide">Email Address</p>
                            <p id="leftEmail" class="text-sm font-semibold text-slate-800 break-all">loading...</p>
                        </div>
                    </div>
                    <div class="flex gap-4 items-start">
                        <svg class="w-5 h-5 text-slate-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 mb-0.5 uppercase tracking-wide">Name</p>
                            <p id="leftName" class="text-sm font-semibold text-slate-800">LOADING...</p>
                        </div>
                    </div>
                    <div class="flex gap-4 items-start">
                        <svg class="w-5 h-5 text-slate-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 mb-0.5 uppercase tracking-wide">System Role</p>
                            <p id="leftRole" class="text-sm font-semibold text-slate-800">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT CONTENT AREA -->
            <div class="flex-1 p-8 md:p-10 bg-white">
                
                <!-- Account Details Section -->
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900 m-0">Account Details</h2>
                        <p class="text-[13px] text-slate-500 mt-1">View and manage your account information.</p>
                    </div>
                    <button class="px-4 py-2 bg-blue-50 text-blue-600 text-[13px] font-bold rounded-md flex items-center gap-2 hover:bg-blue-100 transition border border-blue-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        Update Information
                    </button>
                </div>

                <div class="space-y-4 mb-10">
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">Email Address</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <input type="text" id="inputEmail" readonly class="input-field cursor-not-allowed">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">Name</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <input type="text" id="inputName" readonly class="input-field cursor-not-allowed">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">System Role</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                            <input type="text" id="inputRole" readonly class="input-field bg-slate-50 cursor-not-allowed text-slate-500">
                        </div>
                    </div>
                </div>

                <!-- Change Password Section -->
                <div class="mb-5">
                    <h2 class="text-lg font-bold text-slate-900 m-0">Change Password</h2>
                    <p class="text-[13px] text-slate-500 mt-1">Update your password to keep your account secure.</p>
                </div>

                <form id="changePwdForm" class="space-y-4">
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">Current Password</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <input type="password" placeholder="Enter your current password" class="input-field">
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">New Password</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <input type="password" id="newPwd" required minlength="8" placeholder="Enter your new password" class="input-field">
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[13px] font-semibold text-slate-700 mb-1.5">Confirm New Password</label>
                        <div class="relative">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <input type="password" id="confirmPwd" required minlength="8" placeholder="Confirm your new password" class="input-field">
                            <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end">
                        <button type="submit" id="btnUpdatePwd" class="px-6 py-2.5 bg-[#1677ff] text-white text-[13px] font-bold rounded-lg hover:bg-blue-600 transition w-full md:w-auto flex justify-center items-center gap-2 shadow-sm">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                            Update Password
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>
    
    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/profile.js"></script>
</body>
</html>
