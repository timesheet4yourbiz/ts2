<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Team | WORKTIMESYS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; min-width: 1280px; }
        .bg-white, .glass-card { background: white; box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02) !important; border: 1px solid rgba(226, 232, 240, 0.6) !important; border-radius: 16px !important; transition: all 0.3s ease; }
        .bg-white:hover, .glass-card:hover { box-shadow: 0 10px 32px -4px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.04) !important; transform: translateY(-2px); }
        
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04); }
        .brand { min-width: 195px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #071a3b; }
        .brand-mark { width: 34px; height: 38px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
        .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 19px; height: 19px; transform: rotate(30deg) skew(-4deg); border-radius: 4px; }
        .brand-mark::before { background: linear-gradient(135deg, #0d6efd 0 52%, #f59e0b 52% 100%); top: 3px; left: 3px; }
        .brand-mark::after { background: linear-gradient(135deg, #0b2d60 0 52%, #ef4444 52% 100%); bottom: 3px; right: 1px; }
        .brand-copy strong { display: block; font-size: 20px; line-height: 18px; letter-spacing: -.8px; font-weight: 800; }
        .brand-copy strong span { color: #0d6efd; }
        .brand-copy small { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; letter-spacing: .35px; color: #34527d; }
        .nav { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        .nav-icon { width: 16px; height: 16px; display: inline-grid; place-items: center; font-size: 15px; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .icon-btn { width: 40px; height: 40px; border: 1px solid #d9e5f3; background: #fff; border-radius: 9px; color: #071a3b; display: grid; place-items: center; position: relative; cursor: pointer; }
        .profile { height: 40px; display: flex; align-items: center; gap: 9px; padding-left: 3px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; background: #1677ff; font-weight: 700; font-size: 15px; }
        .profile-text { line-height: 1.15; }
        .profile-text strong { display: block; font-size: 11px; }
        .profile-text small { display: block; margin-top: 2px; color: #60779b; font-size: 9px; }

        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { border-bottom: 2px solid #f1f5f9; padding: 16px; text-align: left; background: #f8fafc; color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { border-bottom: 1px solid #f1f5f9; padding: 12px 16px; font-size: 13px; color: #1e293b; background: white; }
        tr:hover td { background-color: #f8fafc; }
        
        .status-active { background: #ecfdf5; color: #10b981; border: 1px solid #a7f3d0; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        .status-inactive { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 500px; max-width: 90%; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; margin-top: 4px; outline: none; }
        .form-input:focus, .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .tab-btn { padding: 12px 24px; font-weight: 600; font-size: 14px; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background-color 0.2s; border-radius: 6px; padding: 8px 16px;}
        .btn-primary:hover { background-color: #1d4ed8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

   <header class="topbar" id="topbarContainer"></header>

    <main class="p-6 max-w-[1480px] mx-auto space-y-6">

       <!-- KPI Cards -->
        <section class="grid grid-cols-3 gap-6 mb-6">
            <!-- Kad 1: Total Members (Biru) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Total Members</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiTotal">0</div>
                </div>
            </div>

            <!-- Kad 2: Active Members (Hijau) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-emerald-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Active Members</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiActive">0</div>
                </div>
            </div>

            <!-- Kad 3: Inactive Members (Merah) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-rose-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Inactive Members</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiInactive">0</div>
                </div>
            </div>
        </section>
        
        <div class="flex border-b border-gray-200 mt-6">
            <button class="tab-btn active" data-tab="membersView">Members List</button>
            <button class="tab-btn" data-tab="groupsView">Team Groups</button>
        </div>

        <!-- VIEW: MEMBERS -->
        <div id="membersView">
            <section class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3 w-3/4">
                    <div class="relative w-full max-w-sm">
                        <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                        <input type="text" id="searchMember" placeholder="Search by name or email..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                    </div>
                    <select id="filterRole" class="border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-700 outline-none focus:border-blue-500">
                        <option value="all">All Roles</option>
                        <option value="Admin">Admin</option>
                        <option value="Manager">Manager</option>
                        <option value="Supervisor">Supervisor</option>
                        <option value="Employee">Employee</option>
                    </select>
                    <select id="filterDept" class="border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-700 outline-none focus:border-blue-500">
                        <option value="all">All Departments</option>
                    </select>
                    <select id="filterStatus" class="border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-700 outline-none focus:border-blue-500">
                        <option value="all">All Status</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-3">
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">
                    <button id="btnImportExcel" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg p-2 shadow-sm">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    </button>
                    <button id="btnAddMember" class="btn-primary">
                        + Add Member
                    </button>
                </div>
            </section>

            <section class="glass-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table>
                        <thead>
                            <tr>
                                <th class="w-12 text-center"><input type="checkbox" class="rounded border-gray-300"></th>
                                <th class="w-12">#</th>
                                <th>NAME</th>
                                <th class="w-48">ROLE</th>
                                <th class="w-40">DEPARTMENT</th>
                                <th class="w-32">RATE (RM)</th>
                                <th class="w-32">STATUS</th>
                                <th class="w-24 text-center">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody">
                            <tr><td colspan="8" class="text-center py-10 text-gray-400">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between p-4 border-t border-gray-100 bg-gray-50/50">
                    <div class="text-xs text-gray-500 font-medium" id="paginationInfo">Showing 0 members</div>
                    <div class="flex items-center gap-1">
                        <button id="btnPrevPage" class="w-8 h-8 flex items-center justify-center rounded border border-gray-300 bg-white text-gray-500 hover:bg-gray-50"><</button>
                        <span id="pageNumbers" class="text-xs font-bold px-2 text-slate-700">Page 1</span>
                        <button id="btnNextPage" class="w-8 h-8 flex items-center justify-center rounded border border-gray-300 bg-white text-gray-500 hover:bg-gray-50">></button>
                    </div>
                </div>
            </section>
        </div>

        <!-- VIEW: GROUPS -->
        <div id="groupsView" style="display:none;">
            <section class="flex justify-between items-center mb-6">
                <div class="relative w-full max-w-sm">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    <input type="text" id="searchGroup" placeholder="Search group..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:border-blue-500 outline-none">
                </div>
                <button id="btnAddGroup" class="btn-primary">+ Add New Group</button>
            </section>
            <section class="glass-card overflow-hidden">
                <table>
                    <thead>
                        <tr>
                            <th>GROUP NAME</th>
                            <th>MANAGER</th>
                            <th>MEMBERS COUNT</th>
                            <th>STATUS</th>
                            <th class="text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody">
                    </tbody>
                </table>
            </section>
        </div>

    </main>

    <!-- MODAL: MEMBER -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-800 m-0" id="modalTitle">Member Profile</h2>
                <button class="text-gray-400 hover:text-red-500 text-2xl leading-none" id="btnCloseModal">×</button>
            </div>
            <form id="memberForm">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Email (Required for Login)</label>
                    <input type="email" id="formEmail" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="formName" class="form-input" required>
                </div>
                <div class="flex gap-4 mb-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Employee ID</label>
                        <input type="text" id="formEmpNo" class="form-input">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Phone</label>
                        <input type="text" id="formPhone" class="form-input">
                    </div>
                </div>
                <div class="flex gap-4 mb-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Department</label>
                        <input type="text" id="formDept" class="form-input">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Position</label>
                        <input type="text" id="formPosition" class="form-input">
                    </div>
                </div>
                <div class="flex gap-4 mb-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">System Role</label>
                        <select id="formRole" class="form-select">
                            <option value="Employee">Employee</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Group</label>
                        <select id="formGroup" class="form-select">
                            <option value="">- No Group -</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 mb-6">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Billable Rate (RM/hr)</label>
                        <input type="number" step="0.01" id="formRate" class="form-input" value="0.00">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
                        <select id="formStatus" class="form-select">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="submit" id="btnSaveMember" class="btn-primary">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: GROUP -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-800 m-0" id="groupModalTitle">Group Details</h2>
                <button class="text-gray-400 hover:text-red-500 text-2xl leading-none" id="btnCloseGroupModal">×</button>
            </div>
            <form id="groupForm">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Group Name</label>
                    <input type="text" id="formGroupName" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Description</label>
                    <textarea id="formGroupDesc" class="form-textarea" rows="3"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Group Manager</label>
                    <select id="formGroupManager" class="form-select">
                        <option value="">- Select Manager -</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
                    <select id="formGroupStatus" class="form-select">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="submit" id="btnSaveGroup" class="btn-primary">Save Group</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/employees.js"></script>
</body>
</html>
