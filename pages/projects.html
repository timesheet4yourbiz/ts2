<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Projects | WORKTIMESYS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f8fafc; -webkit-font-smoothing: antialiased; min-width: 1280px !important; overflow-x: auto !important; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; }
        .bg-white, .glass-card { background: white; box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02) !important; border: 1px solid rgba(226, 232, 240, 0.6) !important; border-radius: 16px !important; transition: all 0.3s ease; }
        .bg-white:hover, .glass-card:hover { box-shadow: 0 10px 32px -4px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.04) !important; transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        h3, .text-slate-800 { letter-spacing: -0.01em; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { border-bottom: 2px solid #f1f5f9 !important; background: #f8fafc; color: #475569; font-weight: 700; font-size: 11px; text-transform: uppercase; padding: 12px 16px; letter-spacing: 0.05em; text-align: left; }
        td { border-bottom: 1px solid #f1f5f9 !important; padding: 12px 16px; text-align: left; vertical-align: middle; }
        
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04) !important; }
        .brand { min-width: 195px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #071a3b; }
        .brand-mark { width: 34px; height: 38px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
        .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 19px; height: 19px; transform: rotate(30deg) skew(-4deg); border-radius: 4px; }
        .brand-mark::before { background: linear-gradient(135deg, #0d6efd 0 52%, #f59e0b 52% 100%); top: 3px; left: 3px; }
        .brand-mark::after { background: linear-gradient(135deg, #0b2d60 0 52%, #ef4444 52% 100%); bottom: 3px; right: 1px; }
        .brand-copy strong { display: block; font-size: 20px; line-height: 18px; letter-spacing: -.8px; font-weight: 800; }
        .brand-copy strong span { color: #0d6efd; }
        .brand-copy small { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; letter-spacing: .35px; color: #34527d; }
        .nav { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        .nav-icon { width: 16px; height: 16px; display: inline-grid; place-items: center; font-size: 15px; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .icon-btn { width: 40px; height: 40px; border: 1px solid #d9e5f3; background: #fff; border-radius: 9px; color: #071a3b; display: grid; place-items: center; position: relative; cursor: pointer; }
        .profile { height: 40px; display: flex; align-items: center; gap: 9px; padding-left: 3px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; background: #1677ff; font-weight: 700; font-size: 15px; }
        .profile-text { line-height: 1.15; }
        .profile-text strong { display: block; font-size: 11px; }
        .profile-text small { display: block; margin-top: 2px; color: #60779b; font-size: 9px; }
        
        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background-color 0.2s; border-radius: 6px; padding: 8px 16px;}
        .btn-primary:hover { background-color: #1d4ed8; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; width: 100%; max-width: 480px; border-radius: 12px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: 0; }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; line-height: 1; padding: 0; }
        .close-btn:hover { color: #ef4444; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; color: #334155; outline: none; margin-bottom: 12px;}
        .form-input:focus, .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
   <header class="topbar" id="topbarContainer"></header>
    <main class="p-6 max-w-[1480px] mx-auto space-y-6">

        <div style="display: flex; justify-content: flex-end; align-items: center;">
            <button id="openModalBtn" class="btn-primary flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                CREATE NEW PROJECT
            </button>
        </div>

       <!-- KPI Cards -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <!-- Kad 1: Total Projects (Biru) -->
            <div class="glass-card p-4 flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Total Projects</div>
                    <div class="text-2xl font-black text-gray-800 truncate" id="kpiTotal">0</div>
                </div>
            </div>

            <!-- Kad 2: Active Projects (Hijau) -->
            <div class="glass-card p-4 flex items-center gap-4">
                <div class="w-14 h-14 bg-emerald-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Active Projects</div>
                    <div class="text-2xl font-black text-gray-800 truncate" id="kpiActive">0</div>
                </div>
            </div>

            <!-- Kad 3: Total Tracked Hours (Ungu) -->
            <div class="glass-card p-4 flex items-center gap-4">
                <div class="w-14 h-14 bg-purple-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Total Tracked Hours</div>
                    <div class="text-2xl font-black text-gray-800 truncate" id="kpiTracked">0.0<span class="text-sm text-gray-500 ml-1 font-medium lowercase">hrs</span></div>
                </div>
            </div>

            <!-- Kad 4: Clients (Oren) -->
            <div class="glass-card p-4 flex items-center gap-4">
                <div class="w-14 h-14 bg-amber-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Clients</div>
                    <div class="text-2xl font-black text-gray-800 truncate" id="kpiClients">0</div>
                </div>
            </div>
        </section>

        <!-- FILTER BAR -->
        <section class="flex flex-wrap justify-between items-center gap-4 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
            <div class="flex items-center gap-3 flex-1 flex-wrap">
                <span style="color: #64748b; font-weight: 700; letter-spacing: 0.5px; font-size: 0.8rem;">FILTER</span>
                <select class="border-none bg-transparent text-slate-600 font-semibold outline-none cursor-pointer"><option>Active</option></select>
                <select id="filterClient" class="border-none bg-transparent text-slate-600 font-semibold outline-none cursor-pointer"><option value="">All Clients</option></select>
                <select class="border-none bg-transparent text-slate-600 font-semibold outline-none cursor-pointer"><option>Access</option></select>
                <select class="border-none bg-transparent text-slate-600 font-semibold outline-none cursor-pointer"><option>Billing</option></select>
                
                <div class="flex flex-1 border-l border-gray-200 pl-4 items-center gap-2 min-w-[200px]">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input id="searchProjectInput" type="text" placeholder="Find by name" class="w-full border-none outline-none bg-transparent text-sm text-slate-700">
                </div>
            </div>
            <button id="applyFilterBtn" class="border border-blue-500 bg-white text-blue-600 px-4 py-2 rounded-lg font-bold text-xs shadow-sm hover:bg-blue-50 transition-colors">APPLY FILTER</button>
        </section>

        <!-- PROJECTS TABLE -->
        <section class="glass-card overflow-hidden">
            <div class="bg-slate-50 p-4 flex justify-between items-center border-b border-gray-100">
                <span class="font-bold text-slate-600 text-sm">Projects (<span id="tableTitleCount">0</span>)</span>
                <span class="text-blue-600 font-semibold text-xs cursor-pointer">Export ▼</span>
            </div>
            
            <div class="overflow-x-auto bg-white">
                <table>
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="w-10 text-center"><input type="checkbox" class="rounded border-gray-300"></th>
                            <th class="w-10">#</th>
                            <th class="w-64">Name</th>
                            <th class="w-48">Client</th>
                            <th class="w-32">Tracked</th>
                            <th class="w-32">Amount</th>
                            <th class="w-48">Progress</th>
                            <th class="w-32">Access</th>
                            <th class="w-32">Status</th>
                            <th class="w-20 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="projectsList" class="divide-y divide-gray-50">
                        <tr><td colspan="10" class="text-center py-10 text-gray-400 font-semibold">Loading projects...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 bg-white border-t border-gray-100 flex justify-between items-center text-xs text-slate-500 font-medium">
                <span id="paginationInfo">Showing 0 to 0 of 0 projects</span>
            </div>
        </section>
    </main>

    <!-- MODAL CENTER -->
    <div id="projectModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Create new Project</h3>
                <button id="closeModalBtn" class="close-btn">×</button>
            </div>
            
            <div style="margin-bottom: 24px;">
                <label class="block text-xs font-bold text-slate-600 mb-1">Project Name</label>
                <input type="text" id="projectNameInput" class="form-input" placeholder="Enter Project name">
                
                <label class="block text-xs font-bold text-slate-600 mb-1 mt-3">Assign Client</label>
                <select id="clientSelect" class="form-select">
                    <option value="">Select client</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button id="cancelBtn" style="background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem;">Cancel</button>
                <button id="saveProjectBtn" class="btn-primary">CREATE</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/projects.js"></script>
</body>
</html>
