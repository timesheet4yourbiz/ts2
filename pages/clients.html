<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Clients | WORKTIMESYS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; min-width: 1280px; }
        
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04); }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        
        .glass-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -4px rgba(0,0,0,0.03); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { border-bottom: 2px solid #f1f5f9; padding: 16px; text-align: left; background: white; color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { border-bottom: 1px solid #f1f5f9; padding: 16px; font-size: 14px; color: #1e293b; background: white; }
        tr:hover td { background-color: #f8fafc; }
        
        .status-active { background: #ecfdf5; color: #10b981; border: 1px solid #a7f3d0; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        .status-inactive { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 450px; max-width: 90%; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .form-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; margin-top: 4px; outline: none; }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- TOP MENU STANDARD -->
    <header class="topbar" id="topbarContainer"></header>

    <main class="p-6 max-w-[1480px] mx-auto pt-8">

        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-[#0b1d44] m-0 tracking-tight">Clients</h1>
            <p class="text-[#0b1d44] font-medium text-sm mt-1 mb-0 opacity-70">Manage your clients and project relationships.</p>
        </div>

        <!-- KPI Cards -->
        <section class="grid grid-cols-3 gap-6 mb-6">
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-2xl">👥</div>
                <div class="flex-1">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Total Clients</div>
                    <div class="text-3xl font-black text-gray-800" id="kpiTotal">0</div>
                    <div class="text-xs text-blue-500 font-semibold mt-1" id="kpiTotalGrowth">↑ All time</div>
                </div>
            </div>
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl">✓</div>
                <div class="flex-1">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Active Clients</div>
                    <div class="text-3xl font-black text-gray-800" id="kpiActive">0</div>
                    <div class="text-xs text-emerald-500 font-semibold mt-1">Currently engaged</div>
                </div>
            </div>
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-2xl">⊘</div>
                <div class="flex-1">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Inactive Clients</div>
                    <div class="text-3xl font-black text-gray-800" id="kpiInactive">0</div>
                    <div class="text-xs text-gray-400 font-semibold mt-1">No active projects</div>
                </div>
            </div>
        </section>

        <!-- Filter Bar -->
        <section class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 w-1/2">
                <div class="relative w-full max-w-md">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    <input type="text" id="searchClient" placeholder="Search client by name..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                </div>
                <select id="filterStatus" class="border border-gray-300 rounded-lg px-4 py-2 text-sm text-gray-700 outline-none focus:border-blue-500">
                    <option value="ALL">All Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                </select>
            </div>
            <button id="openModalBtn" class="bg-blue-600 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-sm hover:bg-blue-700 flex items-center gap-2">
                + Add Client
            </button>
        </section>

        <!-- Table -->
        <section class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th class="w-12 text-center"><input type="checkbox" class="rounded border-gray-300"></th>
                            <th class="w-16">#</th>
                            <th>CLIENT NAME</th>
                            <th class="w-40">STATUS</th>
                            <th class="w-48">CREATED DATE</th>
                            <th class="w-32">PROJECTS</th>
                            <th class="w-32 text-center">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="clientsList">
                        <tr><td colspan="7" class="text-center py-10 text-gray-400">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="flex items-center justify-between p-4 border-t border-gray-100 bg-gray-50/50">
                <div class="text-xs text-gray-500 font-medium" id="paginationInfo">Showing 0 clients</div>
                <div class="flex items-center gap-1">
                    <button class="w-8 h-8 flex items-center justify-center rounded border border-gray-300 bg-white text-gray-500 hover:bg-gray-50"><</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded bg-blue-600 text-white font-medium">1</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded border border-gray-300 bg-white text-gray-500 hover:bg-gray-50">></button>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL FORM: CREATE / EDIT CLIENT -->
    <div id="clientModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-slate-800 m-0" id="modalTitle">Create New Client</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-red-500 text-2xl leading-none">×</button>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-600 mb-1">Client Name</label>
                <input type="text" id="clientNameInput" class="form-input" placeholder="e.g. FFCM Engineering">
            </div>
            <div class="flex justify-end gap-3">
                <button id="cancelBtn" class="px-5 py-2.5 rounded-lg border border-gray-300 text-slate-600 font-semibold text-sm hover:bg-gray-50">Cancel</button>
                <button id="saveClientBtn" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-bold text-sm hover:bg-blue-700">Create Client</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/clients.js"></script>
</body>
</html>
