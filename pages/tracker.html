<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Time Tracker | WORKTIMESYS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f8fafc; -webkit-font-smoothing: antialiased; min-width: 1280px !important; overflow-x: auto !important; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; }
        .glass-card { background: white; box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02) !important; border: 1px solid rgba(226, 232, 240, 0.6) !important; border-radius: 12px !important; transition: all 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04) !important; }
        .brand { min-width: 195px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #071a3b; }
        .brand-mark { width: 34px; height: 38px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
        .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 19px; height: 19px; transform: rotate(30deg) skew(-4deg); border-radius: 4px; }
        .brand-mark::before { background: linear-gradient(135deg, #0d6efd 0 52%, #f59e0b 52% 100%); top: 3px; left: 3px; }
        .brand-mark::after { background: linear-gradient(135deg, #0b2d60 0 52%, #ef4444 52% 100%); bottom: 3px; right: 1px; }
        .brand-copy strong { display: block; font-size: 19px; line-height: 18px; letter-spacing: -.8px; font-weight: 800; }
        .brand-copy strong span { color: #0d6efd; }
        .brand-copy small { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; letter-spacing: .35px; color: #34527d; }
        .nav { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        .profile { height: 40px; display: flex; align-items: center; gap: 9px; padding-left: 3px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; background: #1677ff; font-weight: 700; font-size: 15px; }

        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background-color 0.2s; border-radius: 8px; padding: 8px 16px;}
        .btn-primary:hover { background-color: #1d4ed8; }

        .ts-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; color: #334155; outline: none; transition: .2s; }
        .ts-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="topbar" id="topbarContainer"></header>

    <main class="p-6 max-w-[1480px] mx-auto space-y-6">

        <!-- Tracker Control Card -->
        <div class="glass-card flex items-center shadow-sm bg-white overflow-hidden">
            <!-- Description -->
            <div class="flex-1 px-4 py-3">
                <input type="text" id="taskDescInput" placeholder="What are you working on?" class="w-full border-none outline-none text-slate-700 bg-transparent placeholder-slate-400 font-medium">
            </div>
            
            <!-- Project & Task -->
            <div class="flex items-center gap-2 px-4 py-3 border-l border-dashed border-slate-200">
                <span class="text-blue-500">⊕</span>
                <select id="projectSelect" class="border-none bg-transparent outline-none text-blue-600 font-semibold cursor-pointer max-w-[140px] text-sm">
                    <option value="">Select Project</option>
                </select>
                <select id="taskSelect" class="border-none bg-transparent outline-none text-slate-500 font-semibold cursor-pointer max-w-[140px] text-xs hidden">
                    <option value="">Select Task</option>
                </select>
            </div>
            
            <!-- Tag -->
            <div class="flex items-center gap-2 px-4 py-3 border-l border-dashed border-slate-200">
                <span class="text-slate-400 text-lg">🏷️</span>
                <select id="tagSelect" class="border-none bg-transparent outline-none text-slate-500 font-medium cursor-pointer w-24 text-xs">
                    <option value="">Tag</option>
                </select>
            </div>
            
            <!-- Billable -->
            <div class="px-4 py-3 border-l border-dashed border-slate-200 text-slate-300 font-bold text-lg cursor-pointer hover:text-blue-500 transition-colors" title="Billable">
                $</div>
            
            <!-- Start & End Time -->
            <div class="flex items-center gap-2 px-4 py-3 border-l border-dashed border-slate-200 text-slate-500 text-xs font-semibold">
                <input type="text" id="startTimeInput" placeholder="--:--" class="w-12 border-none outline-none text-center bg-transparent"> - 
                <input type="text" id="endTimeInput" placeholder="--:--" class="w-12 border-none outline-none text-center bg-transparent">
            </div>
            
            <!-- Date -->
            <div class="flex items-center gap-2 px-4 py-3 border-l border-dashed border-slate-200 text-slate-500 text-xs font-semibold cursor-pointer">
                📅 Today
            </div>
            
            <!-- Timer Display -->
            <div id="timerDisplay" class="px-6 py-3 border-l border-dashed border-slate-200 text-xl font-black text-slate-800 min-w-[120px] text-center tracking-wide">
                0:00:00
            </div>
            
            <!-- Buttons -->
            <button id="timerBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold tracking-widest text-sm h-full px-8 uppercase transition-colors min-h-[60px]">START</button>
            <div class="px-4 bg-slate-50 border-l border-slate-200 h-full flex items-center text-slate-400 font-bold text-xl cursor-pointer hover:bg-slate-100 min-h-[60px]">
                ⋮
            </div>
        </div>

        <!-- Entries List -->
        <div id="entriesContainer" class="mt-8">
            <div class="text-center p-10 text-slate-400 font-semibold">Memuatkan rekod...</div>
        </div>

    </main>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/tracker.js"></script>
</body>
</html>
