<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cranetrack — Dashboard>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .ct-project-row, .ct-member-row, .ct-legend-row, .ct-status-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid #f1f5f9; }
        .ct-progress, .ct-member-progress { flex: 1; margin: 0 0.75rem; height: 6px; background-color: #f1f5f9; border-radius: 9999px; overflow: hidden; }
        .ct-progress i, .ct-member-progress i { display: block; height: 100%; border-radius: 9999px; }
        .ct-rank { font-weight: 800; color: #64748b; width: 1.25rem; }
        .ct-member-avatar { width: 1.75rem; height: 1.75rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 0.65rem; }
        .ct-empty { color: #94a3b8; text-align: center; padding: 1.5rem; font-size: 0.75rem; }
    >/style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- 1. TOP NAVIGATION MENU -->
    <nav class="bg-white border-b border-gray-200 px-6 py-2.5 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2.5 cursor-pointer">
                <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center font-black shadow-md shadow-indigo-100">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="font-extrabold text-lg text-slate-900 tracking-tight leading-none block">CRANETRACK</span>
                    <span class="text-[9px] block text-gray-400 font-bold tracking-widest uppercase mt-0.5">Time | Project | Team</span>
                </div>
            </div>

            <div class="hidden lg:flex items-center space-x-1 text-xs font-semibold text-gray-600">
                <a href="#" class="px-3.5 py-2 rounded-md bg-blue-600 text-white flex items-center gap-2 shadow-sm transition-all"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
                <a href="#" class="px-3.5 py-2 rounded-md hover:bg-gray-100 hover:text-gray-900 flex items-center gap-2 transition-colors"><i data-lucide="timer" class="w-4 h-4"></i> Time Tracking</a>
                <a href="#" class="px-3.5 py-2 rounded-md hover:bg-gray-100 hover:text-gray-900 flex items-center gap-2 transition-colors"><i data-lucide="calendar-days" class="w-4 h-4"></i> Timesheet</a>
                <a href="#" class="px-3.5 py-2 rounded-md hover:bg-gray-100 hover:text-gray-900 flex items-center gap-2 transition-colors"><i data-lucide="folder-kanban" class="w-4 h-4"></i> Projects</a>
            </div>
        </div>

        <div class="flex items-center space-x-4 text-xs">
            <select id="filterProject" class="hidden"><option value="all">All Projects</option></select>
            <select id="filterTeam" class="hidden"><option value="all">All Teams</option></select>

            <div class="border border-gray-200 rounded-lg px-2.5 py-1.5 flex items-center gap-2 bg-gray-50 shadow-sm">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-gray-400"></i>
                <span id="dashDateRangeText" class="font-semibold text-slate-700">Loading period...</span>
                <button id="prevDashBtn" class="hover:bg-gray-200 px-1 rounded text-gray-600 font-bold">‹</button>
                <button id="nextDashBtn" class="hover:bg-gray-200 px-1 rounded text-gray-600 font-bold">›</button>
            </div>

            <div class="flex items-center gap-2.5 pl-3 border-l border-gray-200">
                <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shadow-sm ring-2 ring-blue-100">M</div>
                <div class="hidden sm:block">
                    <p class="font-bold text-slate-800 text-xs leading-none .wt-user-name">MOHAMAD</p>
                    <p id="userEmail" class="text-[10px] text-gray-400 font-medium leading-tight mt-0.5">Administrator</p>
                </div>
            </div>
        </div>
    </nav>

    <!-- 2. MAIN DASHBOARD CONTENT --<
    <main class="max-w-[1600px] mx-auto p-6 space-y-6">

        <!-- WELCOME BANNER --<
        <div class="bg-gradient-to-r from-blue-900 via-indigo-800 to-slate-900 text-white p-8 rounded-2xl shadow-lg flex justify-between items-center relative overflow-hidden">
            <div class="absolute right-0 top-0 w-1/2 h-full bg-white opacity-5 transform skew-x-12 translate-x-20 pointer-events-none"></div>

            <div class="space-y-2 relative z-10">
                <p class="text-xs font-bold tracking-[0.2em] text-blue-300 uppercase">Welcome Back</p>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Good Afternoon, <span id="heroUserName">Mohamad</span> 👋</h1>
                <p class="text-sm md:text-base text-blue-100/80 font-medium mt-1">Track time. Deliver projects. Build a better tomorrow.</p>
            </div>

            <div class="hidden lg:block relative z-10 text-right border-l border-white/20 pl-8 text-xs text-blue-100/70 space-y-1.5 tracking-widest font-bold uppercase">
                <p class="flex justify-end items-center gap-2">Plan <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i></p>
                <p class="flex justify-end items-center gap-2">Execute <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i></p>
                <p class="flex justify-end items-center gap-2 text-white font-extrabold">Monitor <i data-lucide="activity" class="w-3.5 h-3.5 text-emerald-400"></i></p>
                <p class="flex justify-end items-center gap-2">Achieve <i data-lucide="target" class="w-3.5 h-3.5"></i></p>
            </div>
        </div>

        <!-- METRIC CARDS --<
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4.5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
                <div class="p-3 bg-indigo-600 text-white rounded-xl shadow-indigo-200 shadow-lg shrink-0">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400">TOTAL HOURS</p>
                    <h2 id="kpiTotalTime" class="text-2xl font-black text-slate-800 tracking-tight">--:--</h2>
                    <p class="text-[10px] font-semibold text-emerald-500 flex items-center gap-0.5 mt-0.5">
                        <i data-lucide="arrow-up-right" class="w-3 h-3"></i> +12% <span class="text-gray-400 font-normal">vs. previous period</span>
                    </p>
                </div>
            </div>

            <div class="bg-white p-4.5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
                <div class="p-3 bg-emerald-500 text-white rounded-xl shadow-emerald-200 shadow-lg shrink-0">
                    <i data-lucide="folder" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400">ACTIVE PROJECTS</p>
                    <h2 id="kpiActiveProjects" class="text-2xl font-black text-slate-800 tracking-tight">0</h2>
                    <p class="text-[10px] font-semibold text-blue-500 flex items-center gap-0.5 mt-0.5">
                        <i data-lucide="trending-up" class="w-3 h-3"></i> Live <span class="text-gray-400 font-normal">portfolio in view</span>
                    </p>
                </div>
            </div>

            <div class="bg-white p-4.5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
                <div class="p-3 bg-orange-500 text-white rounded-xl shadow-orange-200 shadow-lg shrink-0">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400">TEAM MEMBERS</p>
                    <h2 id="kpiTeamMembers" class="text-2xl font-black text-slate-800 tracking-tight">0</h2>
                    <p class="text-[10px] font-semibold text-gray-400 flex items-center gap-0.5 mt-0.5">
                        <i data-lucide="minus" class="w-3 h-3"></i> Visible <span class="text-gray-400 font-normal">team activity</span>
                    </p>
                </div>
            </div>

            <div class="bg-white p-4.5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4 hover:shadow-md transition-shadow">
                <div class="p-3 bg-rose-500 text-white rounded-xl shadow-rose-200 shadow-lg shrink-0">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400">TOP CLIENT / PROJECT</p>
                    <h2 id="kpiTopProject" class="text-sm font-black text-slate-800 truncate">—</h2>
                    <p class="text-[10px] font-bold text-rose-500 mt-0.5">Highest <span class="text-gray-400 font-normal">tracked time</span></p>
                </div>
            </div>
        </div>

        <!-- 3. VISUAL FILTER BAR (SEPERTI PROPOSAL) --<
        <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-3 flex-1 min-w-[300px]">
                <div class="flex items-center gap-2 border border-gray-200 rounded-lg px-3 py-1.5 bg-gray-50 flex-1">
                    <i data-lucide="filter" class="w-3.5 h-3.5 text-gray-400"></i>
                    <select id="filterProject2" class="bg-transparent font-medium text-slate-700 w-full outline-none">
                        <option value="all">All Projects</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 border border-gray-200 rounded-lg px-3 py-1.5 bg-gray-50 flex-1">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-gray-400"></i>
                    <select id="filterTeam2" class="bg-transparent font-medium text-slate-700 w-full outline-none">
                        <option value="all">All Teams</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 border border-gray-200 rounded-lg px-3 py-1.5 bg-gray-50 flex-1">
                    <i data-lucide="building" class="w-3.5 h-3.5 text-gray-400"></i>
                    <select id="filterClient" class="bg-transparent font-medium text-slate-700 w-full outline-none">
                        <option value="all">All Clients</option>
                    </select>
                </div>
            </div>

            <button id="applyDashboardFilter" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-1.5 rounded-lg flex items-center gap-2 transition-colors shadow-sm">
                <i data-lucide="check" class="w-4 h-4"></i> Apply Filter
            </button>
        </div>

        <!-- 4. MAIN CHARTS (BAR + DONUT BESERTA LEGEND SIDE-BY-SIDE) --<
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm lg:col-span-2 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <i data-lucide="bar-chart-2" class="w-4 h-4 text-indigo-600"></i> Tracked Time by Day
                        </h3>
                        <p class="text-xs text-gray-400 mt-0.5">Total hours tracked across all projects and team members</p>
                    </div>
                </div>
                <div class="h-72 w-full relative">
                    <canvas id="stackedBarChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-4 h-4 text-emerald-600"></i> Project Distribution
                    </h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center h-full">
                    <div class="h-56 w-full relative flex items-center justify-center">
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-1">
                            <span id="donutTotal" class="text-xl font-black text-slate-800 tracking-tight">--:--</span>
                            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">Total Hours</span>
                        </div>
                        <canvas id="donutChart"></canvas>
                    </div>
                    <div id="projectDistributionLegend" class="space-y-1 overflow-y-auto max-h-56 text-xs"></div>
                </div>
            </div>
        </div>

        <!-- 5. THREE ANALYTICS CARDS (TOP PROJECTS, TEAM PERFORMANCE, PROJECT STATUS) --<
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4 text-xs uppercase tracking-wider text-gray-500">
                    <i data-lucide="trophy" class="w-4 h-4 text-amber-500"></i> Top Projects
                </h3>
                <div id="projectRankingList" class="hidden"></div>
                <div id="topProjectsList" class="space-y-2 text-xs"></div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-4 text-xs uppercase tracking-wider text-gray-500">
                    <i data-lucide="activity" class="w-4 h-4 text-blue-500"></i> Team Performance
                </h3>
                <div id="teamPerformanceList" class="space-y-2 text-xs"></div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 mb-2 text-xs uppercase tracking-wider text-gray-500">
                    <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i> Project Status
                </h3>
                <div class="grid grid-cols-2 gap-2 items-center h-full">
                    <div class="h-36 w-full relative flex items-center justify-center">
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span id="projectStatusTotal" class="text-lg font-black text-slate-800">0</span>
                            <span class="text-[8px] font-bold text-gray-400 uppercase">Projects</span>
                        </div>
                        <canvas id="projectStatusChart"></canvas>
                    </div>
                    <div id="projectStatusLegend" class="space-y-1 text-xs"></div>
                </div>
            </div>
        </div>

        <!-- 6. RECENT TEAM ACTIVITIES TABLE (BERSAMA TOOL CARIAN & PENAPIS STATUS) --<
        <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm mt-6">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                <div>
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-indigo-600"></i> Recent Team Activities
                    </h3>
                    <p class="text-xs text-gray-400 mt-0.5">Live and historical activity for the selected period</p>
                </div>

                <div class="flex items-center gap-3 text-xs flex-wrap">
                    <div class="relative">
                        <input id="searchMemberInput" type="search" placeholder="Search member..." class="border border-gray-200 rounded-lg pl-8 pr-3 py-1.5 bg-gray-50 text-xs outline-none focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-2.5"></i>
                    </div>

                    <select id="teamStatusFilter" class="border border-gray-200 rounded-lg px-2.5 py-1.5 bg-gray-50 text-xs">
                        <option value="all">All Status</option>
                        <option value="working">Working</option>
                        <option value="idle">Idle</option>
                    </select>

                    <select id="recordsPerPage" class="border border-gray-200 rounded-lg px-2 py-1.5 bg-gray-50 text-xs">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-wider bg-slate-50/50">
                            <th class="py-3 px-3 sortable-header cursor-pointer" data-sort="member"># / TEAM MEMBER</th>
                            <th class="py-3 px-3 sortable-header cursor-pointer" data-sort="activity">LATEST ACTIVITY</th>
                            <th class="py-3 px-3">STATUS</th>
                            <th class="py-3 px-3 text-center">CURRENT TIMER</th>
                            <th class="py-3 px-3 sortable-header cursor-pointer" data-sort="tracked">TOTAL TRACKED</th>
                            <th class="py-3 px-3">WEEKLY BREAKDOWN</th>
                            <th class="py-3 px-3 text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="teamActivitiesBody" class="divide-y divide-gray-50">
                        <tr><td colspan="7" class="py-6 text-center text-gray-400">Loading team activity...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="flex justify-between items-center mt-4 text-xs text-gray-500 px-1">
                <span>Showing active team records</span>
                <div class="flex gap-1.5">
                    <button id="btnPrev" class="px-3 py-1 border border-gray-200 rounded-md hover:bg-gray-100 font-medium">‹ Prev</button>
                    <button id="btnNext" class="px-3 py-1 border border-gray-200 rounded-md hover:bg-gray-100 font-medium">Next ›</button>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPTS --<
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/dashboard.js"></script>

</body>
</html>
