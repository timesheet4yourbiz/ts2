<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Tags | WORKTIMESYS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; min-width: 1280px; }
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04); }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        .hero { background: linear-gradient(90deg, rgba(200,230,255,.9) 0%, rgba(236,247,255,.8) 40%, rgba(7,48,103,.95) 100%), url("https://images.unsplash.com/photo-1541888087819-3315a6b09335?auto=format&fit=crop&w=1800&q=80") center/cover; border-radius: 12px; border: 1px solid #d8e7f7; }
        .glass-card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -4px rgba(0,0,0,0.03); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { border-bottom: 2px solid #f1f5f9; padding: 16px; text-align: left; background: white; color: #64748b; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { border-bottom: 1px solid #f1f5f9; padding: 16px; font-size: 14px; color: #1e293b; background: white; }
        tr:hover td { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- TOP MENU DIURUSKAN OLEH SIDEBAR.JS -->
    <header class="topbar" id="topbarContainer"></header>

    <main class="p-6 max-w-[1480px] mx-auto">
       

        <!-- KPI Cards -->
        <section class="grid grid-cols-3 gap-6 mb-6">
            <!-- Kad 1: Total Tags (Ungu) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-purple-600 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Total Tags</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiTotal">0</div>
                </div>
            </div>

            <!-- Kad 2: Active Tags (Hijau) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-emerald-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Active Tags</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiActive">0</div>
                </div>
            </div>

            <!-- Kad 3: Inactive Tags (Merah) -->
            <div class="glass-card p-5 flex items-center gap-4">
                <div class="w-14 h-14 bg-rose-500 text-white rounded-xl flex items-center justify-center shadow-sm flex-none">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Inactive Tags</div>
                    <div class="text-3xl font-black text-gray-800 truncate" id="kpiInactive">0</div>
                </div>
            </div>
        </section>

        <!-- Filter Bar -->
        <section class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 w-1/2">
                <div class="relative w-full max-w-md">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    <input type="text" id="searchTag" placeholder="Search tag by name..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <button id="btnAddTag" class="bg-blue-600 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-sm hover:bg-blue-700 flex items-center gap-2">
                + Add New Tag
            </button>
        </section>

        <!-- Table -->
        <section class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table>
                    <thead>
                        <tr>
                            <th class="w-12 text-center"><input type="checkbox" class="rounded border-gray-300"></th>
                            <th class="w-16">#</th>
                            <th>NAME</th>
                            <th class="w-40">STATUS</th>
                            <th class="w-48">CREATED DATE</th>
                            <th class="w-40">USAGE (HOURS)</th>
                            <th class="w-32 text-center">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tagsTableBody">
                        <tr><td colspan="7" class="text-center py-10 text-gray-400">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="flex items-center justify-between p-4 border-t border-gray-100 bg-gray-50/50">
                <div class="text-xs text-gray-500 font-medium" id="paginationInfo">Showing 0 tags</div>
            </div>
        </section>
    </main>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/tags.js"></script>
</body>
</html>
