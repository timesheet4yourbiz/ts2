<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Tasks | WORKTIME</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f8fafc; -webkit-font-smoothing: antialiased; min-width: 1280px !important; overflow-x: auto !important; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; }
        .bg-white, .glass-card { background: white; box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.03), 0 2px 8px -2px rgba(0, 0, 0, 0.02) !important; border: 1px solid rgba(226, 232, 240, 0.6) !important; border-radius: 16px !important; transition: all 0.3s ease; }
        .bg-white:hover, .glass-card:hover { box-shadow: 0 10px 32px -4px rgba(0, 0, 0, 0.06), 0 4px 12px -2px rgba(0, 0, 0, 0.04) !important; transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        h3, .text-slate-800 { letter-spacing: -0.01em; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { border-bottom: 2px solid #f1f5f9 !important; background: #f8fafc; color: #475569; font-weight: 700; font-size: 11px; text-transform: uppercase; padding: 12px 16px; letter-spacing: 0.05em; text-align: left; }
        td { border-bottom: 1px solid #f1f5f9 !important; padding: 12px 16px; text-align: left; vertical-align: middle; }
        
        .topbar { height: 60px; background: rgba(255,255,255,.97); border-bottom: 1px solid #e4edf7; display: flex; align-items: center; padding: 0 24px; gap: 22px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(7,26,59,.04) !important; }
        .brand { min-width: 195px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #071a3b; }
        .brand-mark { width: 34px; height: 38px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
        .brand-mark::before, .brand-mark::after { content: ""; position: absolute; width: 19px; height: 19px; transform: rotate(30deg) skew(-4deg); border-radius: 4px; }
        .brand-mark::before { background: linear-gradient(135deg, #0d6efd 0 52%, #f59e0b 52% 100%); top: 3px; left: 3px; }
        .brand-mark::after { background: linear-gradient(135deg, #0b2d60 0 52%, #ef4444 52% 100%); bottom: 3px; right: 1px; }
        .brand-copy strong { display: block; font-size: 20px; line-height: 18px; letter-spacing: -.8px; font-weight: 800; }
        .brand-copy strong span { color: #0d6efd; }
        .brand-copy small { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; letter-spacing: .35px; color: #34527d; }
        .nav { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .nav-link { height: 40px; padding: 0 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 7px; color: #122b54; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; transition: .2s ease; }
        .nav-link:hover { background: #f0f6ff; }
        .nav-link.active { color: white; background: linear-gradient(135deg, #0d6efd, #187bff); box-shadow: 0 6px 14px rgba(13,110,253,.22); }
        .nav-icon { width: 16px; height: 16px; display: inline-grid; place-items: center; font-size: 15px; }
        .top-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        .icon-btn { width: 40px; height: 40px; border: 1px solid #d9e5f3; background: #fff; border-radius: 9px; color: #071a3b; display: grid; place-items: center; position: relative; cursor: pointer; }
        .profile { height: 40px; display: flex; align-items: center; gap: 9px; padding-left: 3px; cursor: pointer; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: white; background: #1677ff; font-weight: 700; font-size: 15px; }
        .profile-text { line-height: 1.15; }
        .profile-text strong { display: block; font-size: 11px; }
        .profile-text small { display: block; margin-top: 2px; color: #60779b; font-size: 9px; }
        
        .btn-primary { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background-color 0.2s; border-radius: 6px; padding: 8px 16px;}
        .btn-primary:hover { background-color: #1d4ed8; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; color: #334155; outline: none; }
        .form-input:focus, .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="topbar">
        <a class="brand" href="dashboard.html" aria-label="WORKTIME">
            <div class="brand-mark"></div>
            <div class="brand-copy">
                <strong>CRANE<span>TRACK</span></strong>
                <small>TIME | PROJECT | TEAM</small>
            </div>
        </a>

        <nav class="nav" id="mainNav" aria-label="Main navigation">
            <a class="nav-link" href="dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
            <a class="nav-link" href="time-tracking.html"><span class="nav-icon">◷</span>Time Tracking</a>
            <a class="nav-link" href="timesheet.html"><span class="nav-icon">▣</span>Timesheet</a>
            <a class="nav-link" href="calendar.html"><span class="nav-icon">▦</span>Calendar</a>
            <a class="nav-link" href="projects.html"><span class="nav-icon">📁</span>Projects</a>
            <a class="nav-link active" href="tasks.html"><span class="nav-icon">☷</span>Tasks</a>
            <a class="nav-link" href="clients.html"><span class="nav-icon">♙</span>Clients</a>
            <a class="nav-link" href="team.html"><span class="nav-icon">♧</span>Team</a>
            <a class="nav-link" href="reports.html"><span class="nav-icon">▥</span>Reports</a>
        </nav>

        <div class="top-actions">
            <button class="icon-btn relative" type="button" title="Notifications">
                🔔
                <span class="notification-dot absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full border border-white">3</span>
            </button>

            <div class="profile relative group">
                <div class="avatar" id="avatarInitial">M</div>
                <div class="profile-text hidden sm:block">
                    <strong id="profileName">USER</strong>
                    <small id="profileRole">Loading...</small>
                </div>
                <span class="ml-1 text-gray-400">⌄</span>
                
                <div class="absolute right-0 top-full mt-2 w-56 bg-white !border-gray-100 rounded-xl shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 overflow-hidden">
                    <div class="px-4 py-3 border-b border-gray-50 bg-slate-50/50">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Signed in as</p>
                        <p class="text-sm font-bold text-slate-800 truncate" id="dropdownEmail">user@email.com</p>
                    </div>
                    <a href="profile.html" class="block px-4 py-3 text-xs font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-colors">👤 My Profile</a>
                    <a href="settings.html" class="block px-4 py-3 text-xs font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-colors border-b border-gray-50">⚙️ Settings</a>
                    <button id="logoutBtn" class="w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 transition-colors">⏻ Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="p-6 max-w-[1480px] mx-auto space-y-6">

        <!-- Borang Tambah Tugasan -->
        <section class="glass-card p-6 flex flex-wrap gap-4 items-end mb-6">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Project</label>
                <select id="projectSelect" class="form-select">
                    <option value="">Select Project...</option>
                </select>
            </div>
            <div class="flex-[2] min-w-[250px]">
                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Task Name</label>
                <input type="text" id="taskNameInput" class="form-input" placeholder="New Task Name">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Tag (Optional)</label>
                <input type="text" id="taskTagInput" class="form-input" placeholder="Insert Tag (e.g. Menganalisa)">
            </div>
            <button id="addTaskBtn" class="btn-primary min-w-[120px]">ADD TASK</button>
        </section>

        <!-- Jadual Tugasan -->
        <section class="glass-card overflow-hidden">
            <div class="bg-slate-50 p-4 border-b border-gray-100 flex justify-between items-center">
                <span class="font-bold text-slate-600 text-sm uppercase tracking-wide">Task Management</span>
            </div>
            
            <div class="overflow-x-auto bg-white">
                <table>
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="w-10 text-center">#</th>
                            <th class="w-64">Project</th>
                            <th class="w-64">Task Name</th>
                            <th class="w-48">Tag</th>
                            <th class="w-32">Status</th>
                            <th class="w-32 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody" class="divide-y divide-gray-50">
                        <tr><td colspan="6" class="text-center py-10 text-gray-400 font-semibold">Loading tasks...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/tasks.js"></script>
</body>
</html>
